[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Simulation only: never installed on the boat. Depends on the boat package
# for the MAVLink codec and the energy equations.
[project]
name = "scout-sim"
version = "0.1.0"
description = "Environment (current, wind, cloud) and power simulation around ArduPilot SITL for scout-forecast"
requires-python = ">=3.9"
dependencies = ["scout-forecast"]

[project.scripts]
scout-sim = "scout_sim.run:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["scout_sim*"]
