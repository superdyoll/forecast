[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Simulation only: never installed on the boat. Uses scout-forecast for the
# energy equations and scout-lowpower for the MAVLink codec.
[project]
name = "scout-sim"
dynamic = ["version"]
description = "Environment (current, wind, cloud) and power simulation around ArduPilot SITL for scout-forecast"
requires-python = ">=3.9"
dependencies = ["scout-forecast==0.1.0", "scout-lowpower==0.1.0"]

[project.scripts]
scout-sim = "scout_sim.run:main"

[tool.setuptools.dynamic]
version = { attr = "scout_sim.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["scout_sim*"]
